method: searched
source: live probes of every Marshmallow host on 2026-07-25
note: >-
  Marshmallow serves exactly one anonymously reachable /.well-known/ document:
  the OpenID Connect discovery metadata at auth.marshmallow.com. Every other
  well-known path on every other host is blocked (403 at the CDN edge on
  www./docs., 401 at the authorization server, 404 on the private API host) or
  is an SPA catch-all. account.marshmallow.com returns HTTP 200 for every
  well-known path but the body is the consumer account HTML shell
  (<!DOCTYPE html> ... "Account | Marshmallow"), NOT a discovery document, so
  those are recorded as html-shell rather than as hits.
