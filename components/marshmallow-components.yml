note: >-
  Marshmallow open-sources its own design system — "Smores" — as installable
  client-side component libraries. These are the components Marshmallow's
  consumer web app and internal tools are built from, published publicly and
  usable by anyone, but they are NOT embeddable API-integration surfaces
  (there is no Marshmallow quote widget, no hosted policy element, no embedded
  claims iframe for third parties). Recorded here as what they are: a public
  front-end component estate, not a partner integration surface.
