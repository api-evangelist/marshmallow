actions:
  openapiHarvested: false
  openapiDirectoryCreated: false
  wellKnownHarvested: well-known/marshmallow-openid-configuration.json
  apisYmlApisCount: 0
  reason: |
    apis[] is intentionally EMPTY. Marshmallow publishes no public, documented,
    self-serve API and no machine-readable API definition. Listing anything in
    apis[] would require inventing a surface that does not exist. The one real
    machine-readable artifact Marshmallow serves anonymously — its OIDC
    discovery document — is recorded verbatim under well-known/ and pointed at
    from the common[] block, which is the honest place for it: it describes how
    Marshmallow authenticates its own and its partners' clients, not an API a
    third party can consume.
